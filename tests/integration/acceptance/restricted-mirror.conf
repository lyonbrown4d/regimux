server {
    listen 5000;
    location /v2/ {
        default_type application/json;
        return 403 '{"errors":[{"code":"DENIED","message":"public mirror denied: repository is not in the allowlist"}]}';
    }
    location /maven/ {
        default_type text/plain;
        return 503 'deliberate unavailable primary for real Maven failover acceptance';
    }
}
